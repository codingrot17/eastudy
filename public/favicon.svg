<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D27B0" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="44" x2="0" y2="156" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="sh" x1="100" y1="0" x2="108" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bolt" x1="108" y1="26" x2="108" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="42" fill="url(#bg)" />

  <!-- Subtle inner rim -->
  <rect x="3" y="3" width="194" height="194" rx="40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.11" />

  <!-- Left page -->
  <rect x="28" y="44" width="80" height="112" rx="6" fill="url(#pg)" />

  <!-- Spine shadow strip -->
  <rect x="100" y="44" width="8" height="112" fill="url(#sh)" />

  <!-- Right page -->
  <rect x="92" y="44" width="80" height="112" rx="6" fill="#dde4ff" fill-opacity="0.80" />

  <!-- Book bottom edge / thickness -->
  <rect x="28" y="152" width="144" height="9" rx="3" fill="#1e1b4b" fill-opacity="0.28" />

  <!-- Left page ruled lines -->
  <rect x="38" y="64" width="54" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.28" />
  <rect x="38" y="74" width="46" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.25" />
  <rect x="38" y="84" width="52" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.22" />
  <rect x="38" y="94" width="40" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.19" />
  <rect x="38" y="104" width="50" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.16" />
  <rect x="38" y="114" width="44" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.13" />
  <rect x="38" y="124" width="48" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.10" />
  <rect x="38" y="134" width="36" height="3" rx="1.5" fill="#4f46e5" fill-opacity="0.08" />

  <!-- Right page ruled lines -->
  <rect x="106" y="64" width="54" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.20" />
  <rect x="106" y="74" width="46" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.18" />
  <rect x="106" y="84" width="50" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.15" />
  <rect x="106" y="94" width="40" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.13" />
  <rect x="106" y="104" width="50" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.11" />
  <rect x="106" y="114" width="42" height="3" rx="1.5" fill="#818cf8" fill-opacity="0.09" />

  <!-- Bolt shadow for depth -->
  <path d="M108 26 L89 92 L102 92 L94 168 L126 82 L112 82 Z"
    fill="#0f0c29" fill-opacity="0.30"
    transform="translate(3 4)" />

  <!-- Lightning bolt -->
  <path d="M108 26 L89 92 L102 92 L94 168 L126 82 L112 82 Z"
    fill="url(#bolt)" />

  <!-- Bright edge highlight on bolt -->
  <path d="M108 26 L89 92 L102 92"
    fill="none" stroke="#fffbeb" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.50" />

  <!-- Glow halo at bolt tip -->
  <circle cx="108" cy="26" r="8" fill="#fde68a" fill-opacity="0.20" />
  <!-- Bright dot -->
  <circle cx="108" cy="26" r="4.5" fill="#fef9c3" fill-opacity="0.98" />
</svg>