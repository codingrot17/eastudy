<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <!-- Theme -->
        <meta name="theme-color" content="#3B35C4" />

        <!-- ── iOS / Safari PWA ── -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Eastudy" />

        <!-- iOS touch icons (Safari uses these for Add to Home Screen) -->
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="/icons/apple-touch-icon-152.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="167x167"
            href="/icons/apple-touch-icon-167.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/icons/apple-touch-icon-180.png"
        />

        <!-- iOS splash screens (optional but improves launch UX) -->
        <link
            rel="apple-touch-startup-image"
            href="/icons/splash-2048x2732.png"
            media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)"
        />
        <link
            rel="apple-touch-startup-image"
            href="/icons/splash-1668x2224.png"
            media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2)"
        />
        <link
            rel="apple-touch-startup-image"
            href="/icons/splash-1125x2436.png"
            media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
        />
        <link
            rel="apple-touch-startup-image"
            href="/icons/splash-750x1334.png"
            media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
        />

        <!-- Standard PWA -->
        <link rel="manifest" href="/manifest.json" />

        <!-- SEO -->
        <meta
            name="description"
            content="Your university learning platform — schedules, announcements, materials in one place."
        />

        <title>Eastudy</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
